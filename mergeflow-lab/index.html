<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MergeFlow Lab – Git repository simulator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1><svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 7.2v9.6M6 7.2C6 12 18 8 18 9.8"/></svg>MergeFlow Lab</h1>
<p class="sub">A small Git repository you can drive yourself. Edit files, commit, branch and merge, and watch the commit graph change as you go.</p>

<div class="bar">
  <label for="scn">Scenario</label><select id="scn"></select>
  <button id="reset">Restart</button><button id="theme">Toggle theme</button>
  <span id="hint" class="hint"></span>
</div>

<section class="box"><h2>Commit graph</h2><div id="graphwrap"><div id="graph"></div></div><p id="info" class="hint" style="margin:8px 0 0">Click a commit to inspect it.</p></section>

<div class="cols">
  <section class="box"><h2><span>Working tree</span><span id="st"></span></h2><div id="tabs" class="tabs"></div><div id="ed"></div></section>
  <section class="box"><h2>Terminal</h2><div id="chips"></div>
    <div class="term"><div id="log" aria-live="polite"></div><div class="prompt"><span id="ps"></span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Git command"></div></div>
  </section>
</div>
</main>

<script src="js/utils.js"></script>
<script src="js/merge.js"></script>
<script src="js/repo.js"></script>
<script src="js/commands.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
